<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS7 Point Code Converter & DPC Checker</title>
    <!-- Зареждане на sql.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #a0a0a0;
            --focus-color: #0056b3;
            --tooltip-bg: #f0f0f0;
            --tooltip-border: #707070;
            --highlight-bg: #fff59d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin: 0 0 16px 0;
            text-align: center;
            font-weight: 600;
        }

        .converter-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 400px;
            margin: 0 auto;
        }

        .group { position: relative; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .input-wrapper { position: relative; width: 100%; }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            font-family: monospace;
        }

        .dec-wrapper input { text-align: left; font-family: inherit; }
        input[type="text"]::placeholder { color: #888888; opacity: 0.8; }
        input[type="text"]:focus { border-color: var(--focus-color); box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.2); }

        .tooltip {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 3px;
            background-color: var(--tooltip-bg);
            border: 1px solid var(--tooltip-border);
            color: #000;
            padding: 2px 6px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 100;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        input:focus + .tooltip { opacity: 1; visibility: visible; }

        .itu-row { display: flex; align-items: center; gap: 6px; }
        .separator { font-weight: bold; color: #666; user-select: none; }

        .search-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .btn-check {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-check:hover { background-color: #004085; }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .status-badge { font-weight: 600; padding: 2px 6px; border-radius: 4px; }
        .status-ready { background-color: #d4edda; color: #155724; }
        .status-loading { background-color: #fff3cd; color: #856404; }

        .table-container {
            overflow-x: auto;
            max-height: 500px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        th { background-color: #f1f3f5; position: sticky; top: 0; padding: 10px; border-bottom: 2px solid var(--border-color); font-weight: 600; }
        td { padding: 8px 10px; border-bottom: 1px solid #e9ecef; }

        tr.highlight-target { background-color: var(--highlight-bg) !important; font-weight: bold; }
        tr.highlight-target td { border-top: 1.5px solid #d4a700; border-bottom: 1.5px solid #d4a700; }
        tr:nth-child(even):not(.highlight-target) { background-color: #f8f9fa; }
        .no-data { text-align: center; padding: 20px; color: #777; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- CONVERTER CARD -->
    <div class="card">
        <h1>SS7 Point Code Converter</h1>
        <div class="converter-grid">
            <div class="group">
                <label for="decInput">Decimal (0 .. 16383)</label>
                <div class="input-wrapper dec-wrapper">
                    <input type="text" id="decInput" placeholder="5446" autocomplete="off" inputmode="numeric">
                    <div class="tooltip">0..16383</div>
                </div>
            </div>

            <div class="group">
                <label>3-8-3 bits (ITU)</label>
                <div class="itu-row">
                    <div class="input-wrapper">
                        <input type="text" id="ituZone" placeholder="2" autocomplete="off" inputmode="numeric">
                        <div class="tooltip">0..7</div>
                    </div>
                    <span class="separator">-</span>
                    <div class="input-wrapper">
                        <input type="text" id="ituArea" placeholder="168" autocomplete="off" inputmode="numeric">
                        <div class="tooltip">0..255</div>
                    </div>
                    <span class="separator">-</span>
                    <div class="input-wrapper">
                        <input type="text" id="ituMember" placeholder="6" autocomplete="off" inputmode="numeric">
                        <div class="tooltip">0..7</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- RESULTS CARD -->
    <div class="card">
        <div class="status-bar">
            <span><strong>Статус на базата:</strong></span>
            <span id="dbStatusBadge" class="status-badge status-loading">Зареждане на базата...</span>
        </div>

        <div class="search-row">
            <button class="btn-check" id="btnCheck">Търсене в ISPC</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>DEC Code</th>
                        <th>ISPC Code</th>
                        <th>Point Name</th>
                        <th>Operator Name</th>
                        <th>Country</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody">
                    <tr>
                        <td colspan="5" class="no-data">Въведете число и натиснете бутона за търсене.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // --- CONVERTER LOGIC ---
    const decInput = document.getElementById('decInput');
    const ituZone = document.getElementById('ituZone');
    const ituArea = document.getElementById('ituArea');
    const ituMember = document.getElementById('ituMember');
    let isUpdating = false;

    function sanitizeInput(inputElement, maxVal) {
        let cleaned = inputElement.value.replace(/\D/g, '');
        if (cleaned !== '') {
            let num = parseInt(cleaned, 10);
            if (num > maxVal) num = maxVal;
            cleaned = num.toString();
        }
        inputElement.value = cleaned;
        return cleaned;
    }

    decInput.addEventListener('input', () => {
        if (isUpdating) return;
        isUpdating = true;
        const valStr = sanitizeInput(decInput, 16383);
        if (valStr === '') {
            ituZone.value = ''; ituArea.value = ''; ituMember.value = '';
        } else {
            const val = parseInt(valStr, 10);
            ituZone.value = (val >> 11) & 0x07;
            ituArea.value = (val >> 3) & 0xFF;
            ituMember.value = val & 0x07;
        }
        isUpdating = false;
    });

    function updateFromItu() {
        if (isUpdating) return;
        isUpdating = true;
        const zStr = sanitizeInput(ituZone, 7);
        const aStr = sanitizeInput(ituArea, 255);
        const mStr = sanitizeInput(ituMember, 7);

        if (zStr === '' && aStr === '' && mStr === '') {
            decInput.value = '';
        } else if (zStr !== '' && aStr !== '' && mStr !== '') {
            const z = parseInt(zStr, 10);
            const a = parseInt(aStr, 10);
            const m = parseInt(mStr, 10);
            decInput.value = (z << 11) + (a << 3) + m;
        } else {
            decInput.value = '';
        }
        isUpdating = false;
    }

    decInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('btnCheck').click();
    });

    [ituZone, ituArea, ituMember].forEach(input => input.addEventListener('input', updateFromItu));
    ituZone.addEventListener('input', () => { if (ituZone.value.length >= 1) ituArea.focus(); });
    ituArea.addEventListener('input', () => { if (ituArea.value.length >= 3 || parseInt(ituArea.value, 10) > 25) ituMember.focus(); });

    // --- AUTOMATIC SQLITE LOADING FROM HOSTING ---
    let db = null;

    async function loadDatabase() {
        const badge = document.getElementById('dbStatusBadge');
        try {
            const SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });
            // Автоматично изтегляме файла 'itu_database.db' от хостинга
            const response = await fetch('itu_database.db');
            if (!response.ok) throw new Error("Файлът itu_database.db не е намерен.");
            
            const buffer = await response.arrayBuffer();
            db = new SQL.Database(new Uint8Array(buffer));
            
            badge.textContent = "Готова за работа";
            badge.className = "status-badge status-ready";
        } catch (err) {
            console.error(err);
            badge.textContent = "Грешка при зареждане";
            badge.className = "status-badge status-loading";
        }
    }

    loadDatabase();

    // --- SEARCH LOGIC ---
    document.getElementById('btnCheck').addEventListener('click', () => {
        const targetDecStr = decInput.value.trim();
        const tableBody = document.getElementById('resultTableBody');

        if (!targetDecStr) {
            alert("Моля, въведете Decimal число!");
            return;
        }

        if (!db) {
            alert("Базата данни все още се зарежда, моля изчакайте секунда.");
            return;
        }

        const targetDec = parseInt(targetDecStr, 10);

        try {
            const targetStmt = db.prepare("SELECT id FROM ispc_codes WHERE CAST(DEC AS INTEGER) = :dec LIMIT 1");
            targetStmt.bind({ ':dec': targetDec });
            
            if (!targetStmt.step()) {
                tableBody.innerHTML = `<tr><td colspan="5" class="no-data">Няма намерено съвпадение за Decimal: <strong>${targetDec}</strong></td></tr>`;
                targetStmt.free();
                return;
            }

            const targetId = targetStmt.getAsObject().id;
            targetStmt.free();

            // 10 реда НАГОРЕ
            const prevStmt = db.prepare("SELECT * FROM ispc_codes WHERE id < :id ORDER BY id DESC LIMIT 10");
            prevStmt.bind({ ':id': targetId });
            let prevRows = [];
            while (prevStmt.step()) prevRows.push(prevStmt.getAsObject());
            prevStmt.free();
            prevRows.reverse();

            // ТАРГЕТЕН ред
            const currStmt = db.prepare("SELECT * FROM ispc_codes WHERE id = :id");
            currStmt.bind({ ':id': targetId });
            currStmt.step();
            const currRow = currStmt.getAsObject();
            currStmt.free();

            // 10 реда НАДОЛУ
            const nextStmt = db.prepare("SELECT * FROM ispc_codes WHERE id > :id ORDER BY id ASC LIMIT 10");
            nextStmt.bind({ ':id': targetId });
            let nextRows = [];
            while (nextStmt.step()) nextRows.push(nextStmt.getAsObject());
            nextStmt.free();

            const allRows = [...prevRows, currRow, ...nextRows];

            tableBody.innerHTML = '';
            allRows.forEach(row => {
                const tr = document.createElement('tr');
                if (row.id === targetId) tr.classList.add('highlight-target');
                tr.innerHTML = `
                    <td>${row.DEC || ''}</td>
                    <td>${row.ISPC || ''}</td>
                    <td>${row.SignallingPointName || ''}</td>
                    <td>${row.OperatorName || ''}</td>
                    <td>${row.Country || ''}</td>
                `;
                tableBody.appendChild(tr);
            });

            const highlightedRow = document.querySelector('.highlight-target');
            if (highlightedRow) {
                highlightedRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

        } catch (err) {
            console.error(err);
            alert("Грешка при заявката. Проверете структурата на базата.");
        }
    });
</script>

</body>
</html>
